AllCops:
  TargetRubyVersion: 2.5
  SuggestExtensions: false
  DisplayCopNames: true
  ExtraDetails: true
  NewCops: enable
  Exclude:
    - "_/**/*"
    - "spec/samples/**/*"

plugins:
  - rubocop-rake

# plugins:
#   - rubocop-rake
#   - rubocop-rspec

Metrics/BlockLength:
  Exclude:
    - "**/spec/**/*"
    - "*.gemspec"
  AllowedMethods:
    - configure
    - context
    - define
    - describe
    - draw
    - factory
    - feature
    - guard
    - included
    - it
    - let
    - let!
    - scenario
    - setup
    - shared_context
    - shared_examples
    - shared_examples_for
    - transaction

Metrics/MethodLength:
  Max: 25

Layout/LineLength:
  Max: 200
  # Ignores annotate output
  AllowedPatterns: ['\A# \*\*']
  IgnoreCopDirectives: true
  Exclude:
    - "**/spec/**/*"

Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

Style/Documentation:
  Enabled: false

Style/BlockComments:
  Enabled: false
  Include:
    - "**/spec/*"
Style/OpenStructUse:
  Enabled: false

Layout/EndOfLine:
  EnforcedStyle: lf
  
# My Preferences - Start
Metrics/ClassLength:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
  Exclude:
    - "**/*"
Metrics/CyclomaticComplexity:
  Enabled: false
  Exclude:
    - "**/*"
Metrics/PerceivedComplexity:
  Enabled: false
  Exclude:
    - "**/*"
Naming/MemoizedInstanceVariableName:
  Enabled: false
Naming/VariableNumber:
  Exclude:
    - "**/spec/**/*"
Style/EmptyMethod:    
  Exclude:
    - "**/spec/**/*"
Metrics/ParameterLists:
  Exclude:
    - "**/spec/**/*"
Layout/EmptyLineBetweenDefs:
  Exclude:
    - "**/spec/**/*"

Lint/AmbiguousBlockAssociation:
  Exclude:
    - "**/spec/**/*"

Style/AccessorGrouping:
  Enabled: false

Layout/SpaceBeforeComma:
  Enabled: false
# My Preferences - End
